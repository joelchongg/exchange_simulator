name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler.name }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-14, cc: gcc-14, cxx: g++-14, packages: g++-14 }
          - { name: clang-18, cc: clang-18, cxx: clang++-18, packages: clang-18 g++-14 }
        preset: [debug, asan, tsan, release]
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.compiler.packages }}

      # Ubuntu 24.04 runners use 32 bits of mmap ASLR entropy, which breaks
      # the sanitizer shadow-memory layout ("unexpected memory mapping").
      - name: Reduce ASLR entropy for sanitizers
        if: matrix.preset == 'asan' || matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DEXSIM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
